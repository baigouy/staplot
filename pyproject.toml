[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "staplot"
version = "0.1.1"
description = "Statistical analysis and publication-quality plotting — a GraphPad Prism replacement"
readme = "README.md"
license = {text = "BSD-2-Clause"}
authors = [{name = "Benoit Aigouy"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
# `X | None` annotations are evaluated at runtime in several modules
requires-python = ">=3.10"
dependencies = [
    "qtpy",
    "PyQt6",
    "matplotlib",
    "numpy",
    "scipy",
    "statsmodels",
    "pandas",
]

[project.optional-dependencies]
excel = ["openpyxl", "xlrd"]
icons = ["qtawesome"]

[project.urls]
Homepage = "https://github.com/baigouy/staplot"

[project.scripts]
staplot = "staplot.main:main"
staplot-editor = "staplot.ui.plot_editor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["staplot*"]
